seed: 30
device: cuda
data:
  contact_cutoff: 8.0
  radii: [6.0, 10.0, 14.0]
  representative_atom: CA
  esm_model: models/esm2_t6_8M_UR50D.pt
  esm_dim: 320
model:
  hidden_dim: 192
  attention_heads: 4
  graph_layers: 2
  dropout: 0.15
loss:
  positive_weight: 5.773476
  negative_weight: 0.547407
  lambda_cluster: 0.10
  cluster_sigma: 6.0
  lambda_pair: 0.10
  pair_temperature: 0.10
training:
  batch_size: 8
  epochs: 100
  lr: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  grad_accumulation: 1
  amp: true
  val_fraction: 0.10
  early_stop_patience: 15
  selection:
    monitor: auprc
    mode: max
    min_delta: 0.00001
    tie_breakers: [mcc, auroc]
    restore_best_at_end: true
  scheduler:
    factor: 0.5
    patience: 5
    min_lr: 0.000001
  output_dir: outputs/default
