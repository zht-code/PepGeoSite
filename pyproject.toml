[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pepgeosite"
version = "0.1.0"
description = "Peptide-conditioned geometric neural network for residue-level protein-peptide binding-site prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "fair-esm==2.0.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["pepgeosite*"]
